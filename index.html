<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Little Chef's Mystery Box</title><style>
:root{--ink:#51301d;--pink:#ff6695;--yellow:#ffce43;--cream:#fff9e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Trebuchet MS',Verdana,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#fff9c9 0 5%,transparent 25%),linear-gradient(160deg,#a8e8ff,#d9f7ff 50%,#fff0d0);overflow-x:hidden}.wrap{max-width:1150px;margin:auto;padding:18px 18px 32px;text-align:center}.header{position:relative;border:6px solid white;border-radius:30px;background:linear-gradient(115deg,#ffdc57,#fff1a6,#ffd36a);box-shadow:0 8px 0 #e8a952,0 15px 32px #68531e25;padding:12px 20px}.eyebrow{display:inline-block;background:#ff6193;color:white;border-radius:999px;padding:5px 23px;font-weight:900;letter-spacing:2px;font-size:clamp(13px,2vw,19px)}h1{font-size:clamp(32px,6vw,67px);line-height:1.06;margin:10px 0 5px;text-shadow:3px 4px 0 white;color:#c64b37;letter-spacing:-2px}h1 span{color:#218cc6}.sub{font-size:clamp(15px,2.2vw,24px);font-weight:900;margin:7px}.chef{font-size:42px;position:absolute;top:22px;left:22px}.chef.right{left:auto;right:22px}.stage{margin:24px auto 10px;min-height:465px;border:6px solid white;border-radius:35px;background:linear-gradient(#f6fdff 0 66%,#f7cd91 66% 71%,#eeb56e 71%);box-shadow:0 14px 34px #537ca63b;position:relative;overflow:hidden;display:flex;align-items:center;flex-direction:column}.stage:before{content:'';position:absolute;inset:0 0 34%;background:repeating-linear-gradient(90deg,transparent 0 105px,#ffffff55 105px 109px);pointer-events:none}.decor{position:absolute;font-size:clamp(25px,4vw,44px);opacity:.75}.d1{top:28px;left:6%}.d2{top:35px;right:7%}.d3{bottom:95px;left:10%}.d4{bottom:90px;right:9%}.instruction{z-index:3;background:white;border:3px solid #ffcd54;border-radius:999px;padding:10px 25px;font-size:clamp(15px,2vw,23px);font-weight:900;margin:22px 10px 0;box-shadow:0 5px 0 #ffdc8b}.box-area{width:min(370px,76vw);height:305px;position:relative;cursor:pointer;z-index:2;touch-action:manipulation;outline-offset:8px;margin-top:8px}.box-area:focus-visible{outline:5px solid #168ac6}.box-shadow{position:absolute;bottom:5px;left:13%;width:74%;height:30px;background:#8a5a3470;border-radius:50%;filter:blur(10px)}.box-base{position:absolute;bottom:24px;left:11%;width:78%;height:185px;border:7px solid #aa532b;border-radius:12px 12px 23px 23px;background:linear-gradient(120deg,#ffac3d 0 22%,#f8912d 23% 73%,#d96b26 74%);box-shadow:inset 0 7px #ffd28c,0 10px 0 #a85228}.box-base:before{content:'';position:absolute;left:44%;top:0;bottom:0;width:13%;background:#ffdd66;border-left:5px solid #dc9c36;border-right:5px solid #dc9c36}.box-lid{position:absolute;z-index:5;left:7%;top:76px;width:86%;height:72px;border:7px solid #aa532b;border-radius:16px;background:linear-gradient(#ffcf59,#f2a137);box-shadow:0 8px 0 #d47728;transform-origin:20% 80%;transition:transform .7s cubic-bezier(.2,1.3,.3,1)}.box-lid:before{content:'';position:absolute;left:44%;width:12%;height:100%;background:#ffe58b;border-left:4px solid #d9a448;border-right:4px solid #d9a448}.box-sign{position:absolute;z-index:4;top:170px;left:23%;width:54%;padding:10px 0;background:#fff9e6;border:4px solid #e5a046;border-radius:16px;font-size:26px;font-weight:1000;box-shadow:0 5px 0 #a85228}.box-sign small{display:block;font-size:12px;letter-spacing:1px;color:#d47336}.box-area.open .box-lid{transform:translate(-16px,-118px) rotate(-22deg)}.surprise{position:absolute;z-index:6;left:50%;top:118px;transform:translate(-50%,60px) scale(.25);opacity:0;transition:transform .7s cubic-bezier(.2,1.4,.2,1),opacity .35s;pointer-events:none;filter:drop-shadow(0 8px 5px #583f2844)}.box-area.open .surprise{transform:translate(-50%,-90px) scale(1);opacity:1}.food-svg{height:175px;width:185px;display:block}.sparkle{position:absolute;font-size:34px;z-index:7;opacity:0;transition:opacity .3s;pointer-events:none}.box-area.open .sparkle{opacity:1;animation:twinkle 1s infinite alternate}.sp1{top:24px;left:2%}.sp2{top:10px;right:3%}.sp3{top:108px;right:0}@keyframes twinkle{to{transform:scale(1.35) rotate(15deg)}}.question{font-weight:1000;font-size:clamp(25px,4vw,42px);background:#fff;border:5px solid #ffb7cc;border-radius:24px;min-width:min(470px,92%);padding:9px 20px;z-index:3;margin:0 10px 20px;box-shadow:0 5px 0 #ffb7cc}.question .answer{color:#ea4e73}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:17px 0}.btn{border:0;border-radius:18px;padding:14px 20px;font-size:clamp(14px,1.8vw,19px);font-family:inherit;font-weight:1000;cursor:pointer;box-shadow:0 6px 0 #0002;transition:transform .15s}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}.primary{background:#ff6093;color:white}.secondary{background:#ffd24c;color:#553415}.blue{background:#42b3e6;color:white}.progress{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:4px}.dot{height:16px;width:16px;border:3px solid #dba04c;border-radius:50%;background:white}.dot.seen{background:#ffa62e}.dot.current{background:#f45e8c;border-color:#f45e8c;transform:scale(1.25)}.footer{font-size:14px;font-weight:700;color:#785d4e;margin:15px 0}.food-label{font-size:clamp(18px,2.5vw,28px);font-weight:1000;margin:0 0 5px}.hidden{display:none!important}@media(max-width:620px){.chef{display:none}.stage{min-height:445px}.box-area{height:310px}.box-lid{top:90px}.box-sign{top:180px}.surprise{top:133px}.food-svg{height:145px;width:155px}.box-area.open .surprise{transform:translate(-50%,-75px) scale(1)}.question{margin-top:0}}
</style></head><body><main class="wrap"><header class="header"><div class="chef">👩‍🍳</div><div class="chef right">🥄</div><div class="eyebrow">WELCOME, LITTLE CHEFS!</div><h1>CHEF'S <span>MYSTERY BOX!</span></h1><p class="sub">✨ Open the box. Discover the food! ✨</p></header><section class="stage"><div class="decor d1">🍽️</div><div class="decor d2">🧁</div><div class="decor d3">🥕</div><div class="decor d4">🍪</div><div id="instruction" class="instruction">👆 Tap the box to open it!</div><div id="box" class="box-area" role="button" tabindex="0" aria-label="Open mystery box"><div class="box-shadow"></div><div class="box-base"></div><div class="box-sign">❔ MYSTERY <small>WHAT'S INSIDE?</small></div><div class="box-lid"></div><div class="surprise" id="surprise"></div><div class="sparkle sp1">✨</div><div class="sparkle sp2">⭐</div><div class="sparkle sp3">✨</div></div><div class="question" id="question">What's inside? 🤔</div></section><div class="progress" id="progress"></div><div class="actions"><button class="btn primary" id="reveal">👀 Show Answer</button><button class="btn secondary" id="next">🎁 Next Surprise</button><button class="btn blue" id="reset">🔄 Play Again</button><button class="btn blue" id="sound">🔊 Sound On</button></div><p class="footer">Little Chef's Magic Kitchen · English Speaking · Look, listen and say!</p></main><script>
const foods=[{name:'APPLE',say:'an apple',emoji:'🍎',svg:`<svg class="food-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path d="M101 48Q99 24 111 15" fill="none" stroke="#6b3b1e" stroke-width="13" stroke-linecap="round"/><path d="M103 34Q137 3 163 26Q141 57 103 34" fill="#49b850" stroke="#207b37" stroke-width="5"/><path d="M99 63C42 24 11 83 30 139C46 193 80 193 99 181C119 195 156 192 174 135C192 73 154 27 99 63Z" fill="#f44342" stroke="#b72134" stroke-width="7"/><path d="M51 89Q60 68 79 67" fill="none" stroke="#ffb2a4" stroke-width="13" stroke-linecap="round"/><ellipse cx="132" cy="157" rx="25" ry="12" fill="#d72c3a" opacity=".35"/></svg>`},{name:'BANANA',say:'a banana',emoji:'🍌',svg:`<svg class="food-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path d="M32 39C40 132 114 177 178 95C163 151 99 199 47 153C12 122 8 73 22 38Z" fill="#ffd93c" stroke="#ac7a16" stroke-width="7"/><path d="M32 39C39 113 108 148 178 95" fill="none" stroke="#fff6a0" stroke-width="13"/><path d="M19 35l20 -6 3 13 -21 6z" fill="#754b2b"/><path d="M173 90l15 -3 -2 15 -12 3z" fill="#754b2b"/><path d="M60 144Q106 183 149 137" fill="none" stroke="#e8a722" stroke-width="6" stroke-linecap="round"/></svg>`},{name:'MILK',say:'milk',emoji:'🥛',svg:`<svg class="food-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path d="M56 55L81 18H126L151 55V177Q150 185 140 185H60Q50 185 50 175V58Z" fill="#fdfefe" stroke="#4389c9" stroke-width="6"/><path d="M81 18L69 53H151L126 18Z" fill="#9fddff" stroke="#4389c9" stroke-width="5"/><path d="M83 18V52" stroke="#4389c9" stroke-width="5"/><path d="M51 81H150V151H51Z" fill="#54baff"/><path d="M76 96Q101 85 123 96Q138 111 117 128Q100 140 80 127Q64 111 76 96Z" fill="white"/><text x="101" y="170" font-size="18" text-anchor="middle" fill="#2275bd" font-family="Arial" font-weight="900">MILK</text><path d="M96 15H127" stroke="#4389c9" stroke-width="8" stroke-linecap="round"/></svg>`},{name:'BREAD',say:'bread',emoji:'🍞',svg:`<svg class="food-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path d="M36 84C10 49 38 22 73 35C96 13 126 25 137 41C173 25 192 62 170 90V175H35Z" fill="#b96b31" stroke="#854319" stroke-width="7"/><path d="M48 92C29 65 51 46 77 57C100 36 124 49 132 62C159 49 175 68 158 93V164H48Z" fill="#ffdfa0" stroke="#f4b95e" stroke-width="6"/><path d="M69 106l7 4M115 92l7 5M94 139l8 4M136 125l5 3" stroke="#e5b46a" stroke-width="5" stroke-linecap="round"/></svg>`}];
let idx=0,open=false,answered=false,muted=false,ctx;const box=document.getElementById('box'),surprise=document.getElementById('surprise'),question=document.getElementById('question'),instruction=document.getElementById('instruction');function chime(){if(muted)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const now=ctx.currentTime;[523.25,659.25,783.99].forEach((freq,i)=>{let osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,now+i*.11);gain.gain.exponentialRampToValueAtTime(.12,now+i*.11+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.11+.5);osc.connect(gain).connect(ctx.destination);osc.start(now+i*.11);osc.stop(now+i*.11+.51)})}catch(e){}}function drawDots(){document.getElementById('progress').innerHTML=foods.map((f,i)=>`<span class="dot ${i<idx?'seen':''} ${i===idx?'current':''}" title="Surprise ${i+1}"></span>`).join('')}function openBox(){if(open){next();return}open=true;answered=false;surprise.innerHTML=foods[idx].svg;box.classList.add('open');question.textContent='What is this? 🤔';instruction.textContent='🗣️ Look! Can you name the food?';chime();document.getElementById('reveal').classList.remove('hidden');drawDots()}function reveal(){if(!open){openBox();return}answered=true;question.innerHTML=`It's <span class="answer">${foods[idx].say}!</span> ${foods[idx].emoji}`;instruction.textContent='🌟 Great speaking, little chef!';chime()}function next(){idx=(idx+1)%foods.length;open=false;answered=false;box.classList.remove('open');question.textContent="What's inside? 🤔";instruction.textContent=idx===0?'🎉 New round! Tap the box!':'👆 Tap the box for the next surprise!';surprise.innerHTML='';drawDots()}function reset(){idx=0;open=false;answered=false;box.classList.remove('open');surprise.innerHTML='';question.textContent="What's inside? 🤔";instruction.textContent='👆 Tap the box to open it!';drawDots()}box.addEventListener('click',openBox);box.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openBox()}});document.getElementById('reveal').addEventListener('click',reveal);document.getElementById('next').addEventListener('click',next);document.getElementById('reset').addEventListener('click',reset);document.getElementById('sound').addEventListener('click',()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇 Sound Off':'🔊 Sound On'});drawDots();
</script></body></html>
